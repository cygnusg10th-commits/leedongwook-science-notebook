<!doctype html>
<html lang="ko"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>페이지를 찾을 수 없습니다 | 이동욱의 과학 수첩</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf6;color:#17233a;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}.box{width:min(560px,calc(100% - 40px));padding:42px;border:1px solid #e6e3da;border-radius:22px;background:#fff;box-shadow:0 18px 48px rgba(23,35,58,.1)}b{color:#315fdb}h1{font-size:clamp(34px,8vw,56px);letter-spacing:-.05em}p{color:#667085;line-height:1.7}button{min-height:48px;margin:8px 8px 0 0;padding:12px 18px;border:0;border-radius:12px;color:#fff;background:#172b4d;font:inherit;font-weight:800;cursor:pointer}.secondary{color:#17233a;border:1px solid #e6e3da;background:#fff}</style></head><body><main class="box"><b>404</b><h1>페이지를 찾을 수 없습니다</h1><p>주소가 변경되었거나 아직 준비되지 않은 콘텐츠입니다.</p><button type="button" id="home">홈으로 이동</button><button class="secondary" type="button" onclick="history.back()">이전 페이지</button></main><script>document.getElementById('home').addEventListener('click',()=>{const p=location.pathname.split('/').filter(Boolean);location.href=location.hostname.endsWith('github.io')&&p.length?`/${p[0]}/`:'/';});</script></body></html>
