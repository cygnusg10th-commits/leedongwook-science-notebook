<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="요청한 주소에 해당하는 과학 수첩 콘텐츠를 찾을 수 없습니다." />
<title>페이지를 찾을 수 없습니다 | 과학 수첩</title>
<!-- 404는 없는 경로 어디에서나 서빙되므로 상대경로로 site.css를 불러올 수 없습니다.
     그래서 이 페이지만 자체 완결 구조를 유지합니다. 색과 서체는 site.css와 맞췄습니다. -->
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf6;color:#17233a;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all}
.box{width:min(560px,calc(100% - 34px));padding:clamp(24px,6vw,42px);border:1px solid #e6e3da;
  border-radius:22px;background:#fff;box-shadow:0 18px 48px rgba(23,35,58,.1)}
.code{display:inline-block;color:#263b94;background:#eaf0ff;border-radius:999px;
  padding:6px 11px;font-size:12px;font-weight:800;letter-spacing:.04em}
h1{margin:16px 0 12px;font-size:clamp(28px,7vw,48px);line-height:1.15;letter-spacing:-.04em}
p{margin:0;color:#667085;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:9px;margin-top:24px}
a.btn,button.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;
  padding:12px 18px;border:1px solid transparent;border-radius:12px;color:#fff;background:#172b4d;
  font:inherit;font-weight:800;cursor:pointer;text-decoration:none}
.btn.secondary{color:#17233a;border-color:#e6e3da;background:#fff}
:focus-visible{outline:3px solid #315fdb;outline-offset:3px}
@media(max-width:520px){.row{flex-direction:column}.row .btn{width:100%}}
</style>
</head>
<body>
<main class="box">
  <span class="code">404</span>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나, 아직 준비되지 않은 콘텐츠입니다. 홈에서 전체 목록을 확인해 보세요.</p>
  <nav class="row" aria-label="이동할 곳">
    <a class="btn" id="home" href="/">홈으로 이동</a>
    <a class="btn secondary" id="all" href="/learn/">전체 콘텐츠 보기</a>
    <button class="btn secondary" type="button" id="back">이전 페이지</button>
  </nav>
</main>
<script>
(() => {
  'use strict';
  // GitHub Pages 프로젝트 경로(/<repo>/...)에서도 올바른 곳으로 보냅니다.
  const segments = location.pathname.split('/').filter(Boolean);
  const root = location.hostname.endsWith('github.io') && segments.length ? '/' + segments[0] + '/' : '/';
  document.getElementById('home').href = root;
  document.getElementById('all').href = root + 'learn/';
  const back = document.getElementById('back');
  if (history.length > 1) back.addEventListener('click', () => history.back());
  else back.hidden = true;
})();
</script>
</body>
</html>
